<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="tata-rebar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b4c7e" />
      <stop offset="50%" stop-color="#567bb3" />
      <stop offset="100%" stop-color="#1b355a" />
