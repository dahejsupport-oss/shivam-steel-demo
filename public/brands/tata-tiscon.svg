    <text x="110" y="20" font-family="'Outfit', sans-serif" font-weight="900" font-style="italic" font-size="15" fill="#003566" text-anchor="middle" letter-spacing="0.08em">TATA TISCON</text>
    <line x1="165" y1="5" x2="175" y2="25" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="180" y1="5" x2="190" y2="25" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
